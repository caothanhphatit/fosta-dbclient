<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="t d" xml:lang="en">
  <title id="t">Sponsor: Fosta AI</title>
  <desc id="d">Fosta AI: API keys for real GPT Codex models and Claude. Pay by bank transfer, no card needed. 2M free tokens to start. Get a key at codex.fosta.app.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1022" />
      <stop offset="0.55" stop-color="#141a46" />
      <stop offset="1" stop-color="#2b1563" />
    </linearGradient>
    <radialGradient id="glowA" cx="0.82" cy="0.15" r="0.5">
      <stop offset="0" stop-color="#5b8def" stop-opacity="0.55" />
      <stop offset="1" stop-color="#5b8def" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="0.12" cy="1.05" r="0.45">
      <stop offset="0" stop-color="#8e5cf6" stop-opacity="0.45" />
      <stop offset="1" stop-color="#8e5cf6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#c4d4ff" />
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8def" />
      <stop offset="1" stop-color="#8e5cf6" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
    <clipPath id="card"><rect width="1200" height="240" rx="20" /></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="240" fill="url(#bg)" />
    <rect width="1200" height="240" fill="url(#grid)" />
    <rect width="1200" height="240" fill="url(#glowA)" />
    <rect width="1200" height="240" fill="url(#glowB)" />
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="238.5" rx="19.5" fill="none" stroke="#8ea8ff" stroke-opacity="0.35" stroke-width="1.5" />

  <g font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- Label -->
    <rect x="48" y="34" width="104" height="26" rx="13" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.28" />
    <text x="100" y="52" text-anchor="middle" fill="#dbe4ff" font-size="12.5" font-weight="700" letter-spacing="2.2">SPONSOR</text>

    <!-- Name and pitch -->
    <text x="46" y="122" fill="url(#name)" font-size="58" font-weight="800" letter-spacing="-1.5">Fosta AI</text>
    <text x="48" y="160" fill="#c9d5f5" font-size="22" font-weight="500">API keys for real GPT Codex models and Claude</text>

    <!-- Points -->
    <g font-size="16.5" fill="#e6ebff" font-weight="600">
      <circle cx="56" cy="199" r="9" fill="#3fbf7f" fill-opacity="0.2" />
      <path d="M51.5 199l3 3 5.5-6" fill="none" stroke="#5fe0a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="72" y="205">GPT Codex &amp; Claude (beta)</text>
      <circle cx="330" cy="199" r="9" fill="#3fbf7f" fill-opacity="0.2" />
      <path d="M325.5 199l3 3 5.5-6" fill="none" stroke="#5fe0a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="346" y="205">Pay by bank transfer, no card</text>
      <circle cx="630" cy="199" r="9" fill="#3fbf7f" fill-opacity="0.2" />
      <path d="M625.5 199l3 3 5.5-6" fill="none" stroke="#5fe0a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="646" y="205">2M free tokens to start</text>
    </g>

    <!-- Call to action -->
    <rect x="884" y="84" width="268" height="60" rx="30" fill="url(#cta)" />
    <rect x="884.5" y="84.5" width="267" height="59" rx="29.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" />
    <text x="1018" y="121" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">Get a key →</text>
    <text x="1018" y="174" text-anchor="middle" fill="#aebcf0" font-size="17" font-weight="600" letter-spacing="0.3">codex.fosta.app</text>
  </g>
</svg>
