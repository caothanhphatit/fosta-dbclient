name: Contract tests

# Runs each engine's contract suites (`contract_<id>` tests, #[ignore]d in the normal test run) against its container from
# dev/compose/<id>.yml. ci/engines/<id>.json lists the compose file, the image versions and the paths that trigger it.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        name: Pick engines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed.txt"
            matrix=$(node ci/plan.mjs --changed "$RUNNER_TEMP/changed.txt")
          else
            matrix=$(node ci/plan.mjs --all)
          fi
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$matrix" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).include.length))')" >> "$GITHUB_OUTPUT"

  contract:
    name: ${{ matrix.id }} ${{ matrix.version }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    # The runner comes from the engine's `runsOn` in ci/engines/<id>.json (ubuntu-24.04 when unset). Mongo needs an older
    # kernel: mongod 8.0.x up to 8.0.34 and 8.3.x up to 8.3.13 refuse to start on kernels 6.19 to 7.0.13 ("MongoDB cannot
    # start: Linux kernel versions 6.19 and newer has a known incompatibility", SERVER-121912: tcmalloc and the kernel's
    # rseq ABI), and both ubuntu-latest (26.04) and ubuntu-24.04 now boot 7.0.0-azure kernels.
    runs-on: ${{ matrix.runsOn }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Per runner image: build scripts compiled against a newer glibc do not run on an older image.
          key: contract-${{ matrix.runsOn }}
      - name: Start ${{ matrix.id }} ${{ matrix.version }}
        run: |
          echo "Kernel $(uname -r)"
          export "${{ matrix.versionEnv }}=${{ matrix.version }}"
          # A container that exits during start-up explains itself here, not only in the Service logs step.
          if ! docker compose -f "${{ matrix.compose }}" up -d --wait; then
            echo "::error::${{ matrix.id }} ${{ matrix.version }} did not start; container state and logs follow."
            docker compose -f "${{ matrix.compose }}" ps -a
            docker compose -f "${{ matrix.compose }}" logs --no-color --tail 200
            exit 1
          fi
      - name: Seed
        if: matrix.seed != ''
        run: |
          export "${{ matrix.versionEnv }}=${{ matrix.version }}"
          # In a subshell: a seed may cd (Oracle's does), and the compose path below is relative to the checkout.
          if ! ( ${{ matrix.seed }} ); then
            echo "::error::seeding ${{ matrix.id }} ${{ matrix.version }} failed; container state and logs follow."
            docker compose -f "${{ matrix.compose }}" ps -a
            docker compose -f "${{ matrix.compose }}" logs --no-color --tail 200
            exit 1
          fi
      - name: Contract tests
        working-directory: src-tauri
        run: |
          cargo test --no-default-features --features web,engines-all "${{ matrix.filter }}" -- --ignored --test-threads=1 2>&1 | tee "$RUNNER_TEMP/test.log"
          # A filter that matches nothing must not pass silently.
          grep -Eq "test result: ok\. [1-9]" "$RUNNER_TEMP/test.log"
      - name: Service logs
        if: failure()
        run: |
          export "${{ matrix.versionEnv }}=${{ matrix.version }}"
          docker compose -f "${{ matrix.compose }}" ps -a
          docker compose -f "${{ matrix.compose }}" logs --no-color --tail 200
      - name: Stop
        if: always()
        run: |
          export "${{ matrix.versionEnv }}=${{ matrix.version }}"
          docker compose -f "${{ matrix.compose }}" down -v
