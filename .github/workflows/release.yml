name: Release

# Pushing a tag vX.Y.Z builds the Windows app and opens a draft GitHub Release for review.
# See "Releasing" in CONTRIBUTING.md.
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version and notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
      docker: ${{ steps.docker.outputs.present }}
    steps:
      # The installed app only accepts updates signed with this key (plugins.updater.pubkey in tauri.conf.json).
      # Checks the shape of the secret without printing it or anything decoded from it: only lengths and offsets are logged.
      # The value is the base64 text `tauri signer generate` writes (a minisign key file, itself holding a base64 line);
      # extra characters after it fail the build late with "failed to decode secret key: Invalid symbol 61, offset ...".
      - name: Updater signing key is set and well-formed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          key="$TAURI_SIGNING_PRIVATE_KEY"
          fail() {
            echo "::error title=TAURI_SIGNING_PRIVATE_KEY::$1 Paste the private key again (Settings > Secrets and variables > Actions): the single line of base64 from the .key file, nothing before or after it."
            exit 1
          }
          if [ -z "$key" ]; then
            echo "::error::The repository secret TAURI_SIGNING_PRIVATE_KEY is missing. Add the updater's private key (Settings > Secrets and variables > Actions); without it installed apps cannot update."
            exit 1
          fi
          echo "Secret length: ${#key} characters"
          stripped=$(printf '%s' "$key" | LC_ALL=C tr -d ' \t\r\n')
          whitespace=$(( ${#key} - ${#stripped} ))
          case "$key" in
            *[[:space:]]) fail "The secret ends with whitespace or a line break ($whitespace whitespace characters in total)." ;;
            [[:space:]]*) fail "The secret starts with whitespace or a line break ($whitespace whitespace characters in total)." ;;
          esac
          [ "$whitespace" -eq 0 ] || fail "The secret contains $whitespace whitespace characters or line breaks inside it."
          if printf '%s' "$key" | LC_ALL=C grep -q '[^A-Za-z0-9+/=]'; then
            fail "The secret contains characters that are not base64 (allowed: A-Z a-z 0-9 + / =)."
          fi
          before_padding="${key%%=*}"
          if [ "${#before_padding}" -lt "${#key}" ]; then
            case "${key:${#before_padding}}" in
              = | ==) ;;
              *) fail "Base64 padding '=' appears at offset ${#before_padding} with more text after it: something was pasted after the key." ;;
            esac
          fi
          [ $(( ${#key} % 4 )) -eq 0 ] || fail "The secret is ${#key} characters long, not a multiple of 4: it is cut off or has extra characters."
          if ! printf '%s' "$key" | base64 -d > /dev/null 2>&1; then
            fail "The secret does not decode as base64."
          fi
          echo "Decoded: $(printf '%s' "$key" | base64 -d | wc -c) bytes, $(printf '%s' "$key" | base64 -d | wc -l) line breaks"
          if ! printf '%s' "$key" | base64 -d | head -n 1 | grep -q '^untrusted comment:'; then
            fail "The decoded secret is not a minisign key file (no 'untrusted comment:' first line). Use the private key (.key), not the public key or the key file's inner line."
          fi
          if ! printf '%s' "$key" | base64 -d | sed -n 2p | tr -d '\r' | LC_ALL=C grep -Eq '^[A-Za-z0-9+/]+={0,2}$'; then
            fail "The second line of the decoded key file is not a single base64 line."
          fi
          echo "The signing key looks well-formed."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches the version files
        id: version
        run: |
          node scripts/version.mjs check "$GITHUB_REF_NAME"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          {
            echo "notes<<FOSTA_RELEASE_NOTES_EOF"
            node scripts/version.mjs changelog "$GITHUB_REF_NAME"
            if [ -f Dockerfile ]; then
              version="${GITHUB_REF_NAME#v}"
              echo
              echo "### Docker (web edition)"
              echo
              echo '```sh'
              echo "docker run -d --name fosta-studio -p 127.0.0.1:8080:8080 -v fosta-studio-data:/data ghcr.io/caothanhphatit/fosta-studio:$version"
              echo "docker logs fosta-studio"
              echo '```'
              echo
              echo "Open the sign-in address printed in the log. Image: [ghcr.io/caothanhphatit/fosta-studio](https://github.com/caothanhphatit/fosta-dbclient/pkgs/container/fosta-studio); settings in [docs/web-edition.md](https://github.com/caothanhphatit/fosta-dbclient/blob/$GITHUB_REF_NAME/docs/web-edition.md)."
            fi
            echo "FOSTA_RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Is there a Docker web edition?
        id: docker
        run: |
          if [ -f Dockerfile ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  windows:
    name: Windows app (NSIS installer + portable exe)
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Tool versions
        shell: bash
        run: |
          echo "node  $(node --version)"
          echo "npm   $(npm --version)"
          rustc --version
          cargo --version
          echo "tauri $(npx --no-install tauri --version)"
      - name: Build and create the draft release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the installer for the in-app updater (tauri.release.conf.json turns on createUpdaterArtifacts).
          # The password secret may be left unset: the key has an empty password.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Fosta Studio ${{ needs.verify.outputs.version }}
          releaseBody: ${{ needs.verify.outputs.notes }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # latest.json, read by installed apps from releases/latest/download/latest.json.
          includeUpdaterJson: true
          # Bundling is off in tauri.conf.json (local builds are portable); the release turns on the NSIS installer.
          args: --config src-tauri/tauri.release.conf.json
      # Diagnostics only: lists what was built and checks the updater files; uploads nothing.
      - name: Bundle files and updater signatures
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          bundle=src-tauri/target/release/bundle
          echo "Built files (bytes, path):"
          if [ -d "$bundle" ]; then find "$bundle" -type f -printf '%12s  %p\n' | sort -k2; else echo "  no $bundle directory"; fi
          if [ -f src-tauri/target/release/fosta-studio.exe ]; then find src-tauri/target/release/fosta-studio.exe -printf '%12s  %p\n'; fi
          status=0
          installers=0
          while IFS= read -r -d '' installer; do
            installers=$((installers + 1))
            if [ -s "$installer.sig" ]; then
              echo "Signature present: $installer.sig"
            else
              echo "::error::Missing or empty updater signature: $installer.sig"
              status=1
            fi
          done < <(find "$bundle" -type f \( -name '*-setup.exe' -o -name '*.msi' \) -print0 2>/dev/null)
          if [ "$installers" -eq 0 ]; then
            echo "::error::No installer was built under $bundle."
            status=1
          fi
          if [ -z "$RELEASE_ID" ]; then
            echo "::warning::tauri-action reported no release id; the release assets and latest.json are not checked."
            exit "$status"
          fi
          echo "Assets on the draft release (bytes, name):"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate --jq '.[] | "\(.size)  \(.name)"'
          asset_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate --jq '.[] | select(.name == "latest.json") | .id')
          if [ -z "$asset_id" ]; then
            echo "::error::latest.json is not on the draft release; installed apps would not see this update."
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$RUNNER_TEMP/latest.json"
          echo "latest.json:"
          cat "$RUNNER_TEMP/latest.json"
          echo
          # Every platform needs a download URL and a signature, or installed apps reject the update.
          node -e '
            const latest = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const platforms = Object.entries(latest.platforms ?? {});
            if (platforms.length === 0) console.log("::error::latest.json lists no platforms.");
            let ok = platforms.length > 0;
            for (const [name, entry] of platforms) {
              console.log(name + ": url " + (entry.url ? "set" : "MISSING") + ", signature " + (entry.signature ? "set" : "MISSING"));
              if (!entry.url || !entry.signature) ok = false;
            }
            if (!ok) console.log("::error::latest.json has a platform without a url or a signature.");
            process.exit(ok ? 0 : 1);
          ' "$RUNNER_TEMP/latest.json" || status=1
          exit "$status"
      - name: Attach the portable exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          portable="Fosta-Studio_${VERSION}_x64_portable.exe"
          cp src-tauri/target/release/fosta-studio.exe "$portable"
          gh release upload "$GITHUB_REF_NAME" "$portable" --clobber --repo "$GITHUB_REPOSITORY"

  docker:
    name: Docker web edition
    needs: verify
    if: needs.verify.outputs.docker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/caothanhphatit/fosta-studio
          flavor: latest=false
          # X.Y.Z, X.Y and latest; pre-releases (vX.Y.Z-rc.1) only get their full version.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Fosta Studio
            org.opencontainers.image.description=Fosta Studio web edition: a database client for 11 engines in your browser
            org.opencontainers.image.licenses=GPL-3.0-only
      # The root Dockerfile builds the UI and `fosta-studio-server` (feature `web`) from the whole repository.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
