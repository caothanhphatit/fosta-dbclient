name: Docker image

# Builds the web edition image on pull requests (no push, plus a smoke test) and publishes `edge` from main
# to GitHub Container Registry. Release images (`X.Y.Z`, `X.Y`, `latest`) are pushed by release.yml from a version tag.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/caothanhphatit/fosta-studio

jobs:
  image:
    name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }} (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=ref,event=pr
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=Fosta Studio
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (sign-in required, health check passes)
        if: github.event_name == 'pull_request'
        run: |
          image="$(echo '${{ steps.meta.outputs.tags }}' | head -n 1)"
          docker run -d --name smoke -p 8080:8080 "$image"
          for _ in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          docker logs smoke | grep -q '/?token='
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'X-Fosta-Studio: 1' http://localhost:8080/api/invoke/get_config)" = 401
          docker rm -f smoke
