[package]
name = "fosta-studio"
version = "0.3.0"
license = "GPL-3.0-only"
repository = "https://github.com/caothanhphatit/fosta-dbclient"
description = "Lightweight desktop database client for MariaDB, MySQL, SQL Server and MongoDB, with workspaces and workspace commands"
edition = "2021"
rust-version = "1.88"
default-run = "fosta-studio"

# The backend core (config, secrets, drivers, assistant, history, tasks and the command bodies) is a library
# with two front-ends: the Tauri desktop app (`desktop`, the default) and the web server of the Docker image
# (`web`). Build the server alone with `cargo build --release --no-default-features --features web`.
[features]
default = ["desktop", "engines-all"]
# The MCP server (mcp/) runs on axum in both editions.
desktop = ["dep:tauri", "dep:tauri-build", "dep:keyring", "dep:tauri-plugin-updater", "dep:tauri-plugin-process", "dep:axum"]
web = [
    "dep:axum",
    "dep:tower-http",
    "dep:chacha20poly1305",
    "dep:hmac",
    "dep:sha2",
    "tokio/rt-multi-thread",
    "tokio/signal",
    "engines-all",
]
# Database engines, one feature each (runtime/registry.rs). Every engine is in the default build and the web image.
engines-all = [
    "engine-mysql",
    "engine-mssql",
    "engine-mongo",
    "engine-postgres",
    "engine-sqlite",
    "engine-clickhouse",
    "engine-oracle",
    "engine-redis",
    "engine-elastic",
]
# The MariaDB/MySQL, SQL Server and MongoDB engine modules are always compiled (not feature-gated yet), so their clients
# stay required and these three features only control registration.
engine-mysql = []
engine-mssql = []
engine-mongo = []
engine-postgres = ["dep:tokio-postgres", "dep:tokio-postgres-rustls"]
engine-sqlite = ["dep:rusqlite"]
engine-clickhouse = []
engine-oracle = ["dep:oracle", "dep:zip"]
engine-redis = ["dep:redis"]
engine-elastic = []

[lib]
name = "fosta_studio"
path = "src/lib.rs"

[[bin]]
name = "fosta-studio"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "fosta-studio-server"
path = "src/server/main.rs"
required-features = ["web"]

[dev-dependencies]
# Test certificates for net::tls.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
async-trait = "0.1"
futures-util = "0.3"
chrono = "0.4"
# TLS through rustls on ring (no aws-lc), settings mapped from the profile in engines/mysql/connect.rs.
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }
mongodb = "3"
keyring = { version = "3", features = ["windows-native"], optional = true }
sqlparser = { version = "0.63", default-features = false, features = ["std", "visitor"] }
getrandom = "0.3"
# Application log (logging.rs): daily rolling files in the data directory.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "registry", "ansi"] }
tracing-appender = "0.2"
# Engine modules (Redis, Elasticsearch / OpenSearch). reqwest also gets the rustls backend everywhere: the
# Elasticsearch client builds its own rustls config (custom CA, fingerprint pinning, insecure).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
base64 = "0.22"
redis = { version = "1.7", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-insecure"], optional = true }
# Engine modules (PostgreSQL, SQLite, ClickHouse over reqwest, Oracle). Oracle Instant Client is loaded at runtime.
tokio-postgres = { version = "0.7.18", optional = true }
tokio-postgres-rustls = { version = "0.14", features = ["ring"], optional = true }
rustls-pki-types = { version = "1.12", features = ["std"] }
webpki-roots = "1"
rusqlite = { version = "0.41.1", features = ["bundled", "column_decltype"], optional = true }
oracle = { version = "0.6.3", features = ["chrono"], optional = true }
# Unpacks the Oracle Instant Client archive the Oracle engine downloads on demand.
zip = { version = "9", default-features = false, features = ["deflate-flate2"], optional = true }
# Network layer (net/): SSH tunnels (russh on ring, so no aws-lc / cmake) and the shared rustls helpers
# (system roots through rustls-native-certs).
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
rustls-native-certs = "0.8"
# Web server (feature `web`)
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["fs", "set-header"], optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
# Update check (commands/update.rs, every edition) and in-place updates of the installed desktop app (feature `desktop`).
semver = "1"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }

# TLS: Windows keeps the system stack (SChannel); elsewhere (the Linux server image) rustls, so no OpenSSL is needed.
[target.'cfg(windows)'.dependencies]
tiberius = { version = "0.12", default-features = false, features = ["tds73", "native-tls", "chrono"] }
reqwest = { version = "0.12", features = ["json"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(not(windows))'.dependencies]
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2", "system-proxy"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
# Unwind so a panic inside a driver is contained to its task (runtime::contain) instead of closing the app.
panic = "unwind"
