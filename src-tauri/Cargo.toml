[package]
name = "fosta-studio"
version = "0.1.0"
license = "GPL-3.0-only"
repository = "https://github.com/caothanhphatit/fosta-dbclient"
description = "Lightweight desktop database client for MariaDB, MySQL, SQL Server and MongoDB, with workspaces and startup tasks"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
async-trait = "0.1"
futures-util = "0.3"
chrono = "0.4"
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "native-tls", "chrono"] }
mongodb = "3"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls-manual-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ring = "0.17"
base64 = "0.22"
redis = { version = "1.7", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-insecure"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
