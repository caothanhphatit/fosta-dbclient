# Test databases for the PostgreSQL, ClickHouse and Oracle engine modules (src-tauri/src/engines/).
# Test-only credentials; never reuse them.
#
#   docker compose -f dev/docker-compose.engines-sql.yml up -d postgres clickhouse
#   docker compose -f dev/docker-compose.engines-sql.yml up -d oracle      # ~2 GB RAM, start it last
#   cd src-tauri && cargo test live_engine_ -- --ignored --test-threads=1
#   docker compose -f dev/docker-compose.engines-sql.yml stop
#
# PostgreSQL 17   127.0.0.1:5432          postgres / studio-root      database shop (schemas public, sales)
# ClickHouse      127.0.0.1:8123 (HTTP)   studio / studio-root        database shop
#                 127.0.0.1:9000 (native)
# Oracle 23ai Free 127.0.0.1:1521         shop / studio-root          service FREEPDB1 (SYSTEM password studio-root)
#
# SQLite needs no container: the live tests build dev/seed/shop.sqlite from dev/seed/sqlite.sql when it is missing.
#
# The Oracle tests also need Oracle Instant Client (Basic or Basic Light, 19c or newer) on PATH; see
# https://www.oracle.com/database/technologies/instant-client/downloads.html. Without it they print a note and pass.
#
# All seeds are generated on first start (empty volume); `docker compose ... down -v` resets them.

name: fosta-dev-sql

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: studio-root
      POSTGRES_DB: shop
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./seed/postgres.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "shop"]
      interval: 5s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: studio
      CLICKHOUSE_PASSWORD: studio-root
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./seed/clickhouse.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "studio", "--password", "studio-root", "-q", "SELECT 1"]
      interval: 5s
      retries: 30

  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: studio-root
      APP_USER: shop
      APP_USER_PASSWORD: studio-root
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - ./seed/oracle.sql:/container-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      retries: 60
