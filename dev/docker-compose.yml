# Local test databases for Fosta Studio: the three engines the app has shipped with. Test-only credentials.
#   docker compose -f dev/docker-compose.yml up -d
#   then: dev/seed-mssql.sh  (SQL Server has no init directory)
#
# One file per engine lives in dev/compose/ (also PostgreSQL, ClickHouse, Oracle, Redis, Elasticsearch, OpenSearch);
# start any of them on its own, e.g. docker compose -f dev/compose/postgres.yml up -d --wait. The contract tests run
# against them: cd src-tauri && cargo test contract_<engine> -- --ignored --test-threads=1

name: db-studio-dev

include:
  - compose/mariadb.yml
  - compose/mssql.yml
  - compose/mongo.yml
