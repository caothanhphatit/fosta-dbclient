# ClickHouse 25.8 for the ClickHouse engine.
# Test-only credentials; never reuse them.
# docker compose -f dev/compose/clickhouse.yml up -d --wait
# 127.0.0.1:8123 (HTTP), 9000 (native)  studio / studio-root  database shop

name: fosta-dev-sql

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: studio
      CLICKHOUSE_PASSWORD: studio-root
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ../seed/clickhouse.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "studio", "--password", "studio-root", "-q", "SELECT 1"]
      interval: 5s
      retries: 30
