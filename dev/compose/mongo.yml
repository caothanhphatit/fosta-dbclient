# MongoDB 8 (MONGO_TAG overrides the image tag) for the contract tests. mongod 8.0.x up to 8.0.34 and 8.3.x up to 8.3.13
# refuse to start on Linux kernels 6.19 to 7.0.13 (SERVER-121912); Docker Desktop and Ubuntu 22.04 hosts are fine, CI
# runs mongo on ubuntu-22.04 (ci/engines/mongo.json).
# Test-only credentials; never reuse them.
# docker compose -f dev/compose/mongo.yml up -d --wait
# 127.0.0.1:27017  root / studio-root  database events (auth db admin); contract data in fosta_contract

name: db-studio-dev

services:
  mongo:
    image: mongo:${MONGO_TAG:-8}
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: studio-root
      MONGO_INITDB_DATABASE: events
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ../seed/mongo.js:/docker-entrypoint-initdb.d/01-seed.js:ro
