# Redis for the Redis engine: 8.2, or the tag in REDIS_TAG (CI runs 7.4 and 8.2).
# Test-only credentials; never reuse them.
# docker compose -f dev/compose/redis.yml up -d --wait   then: sh dev/seed-nosql.sh
# 127.0.0.1:6379  no ACL user, password studio-redis

name: fosta-dev-nosql

services:
  redis:
    image: redis:${REDIS_TAG:-8.2}
    command: ["redis-server", "--requirepass", "studio-redis", "--maxmemory", "256mb", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "studio-redis", "--no-auth-warning", "ping"]
      interval: 3s
      retries: 30
